[project]
name = "telegram-bot-template"
version = "0.1.0"
description = "Тонкий шаблон Telegram-бота: чистая бизнес-логика на aiogram_dialog поверх pylibinfra[tgbotkit]"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "sftbmb-core" }]

# Директива «вся инфра в pylibinfra»: единственная рантайм-зависимость — pylibinfra
# с extra [tgbotkit] (tgbotkit + aiogram + aiogram-dialog + fluent.runtime). Остальная
# инфра (dishka/redis/httpx/otel/fastapi/structlog/nats) приезжает транзитивом. Ноль
# прямых инфра-пинов. Конкретный источник/ревизия — в [tool.uv.sources] ниже.
dependencies = [
    "pylibinfra[tgbotkit]",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.18,<2",
    "import-linter>=2.5",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "respx>=0.22",            # мок httpx для backend-тестов (мокаем порт/транспорт-границу)
    "pylibinfra[testkit]",   # testcontainers redis/nats + bottest (flow-тесты диалогов)
]

# Приватный pylibinfra резолвится по git-ref в gitea — часть контракта форка: бот
# пинится на конкретную ревизию инфры, как go-сервис на go.mod-версию.
# СЕЙЧАС: коммит 298f005 — tgbotkit с reserve/commit-дедупом, recovery→dp.errors,
# JetStream failure-path/drain, fail-open/reconnect/health-probes, GCRA rate-limit,
# SecretStr. (тег v0.1.0 — bootstrap-коммит, ДО tgbotkit). Свапнуть на релиз-тег
# (tag = "vX.Y.Z"), как только pylibinfra будет тегнут на ревизии с tgbotkit.
[tool.uv.sources]
pylibinfra = { git = "https://git.sftbmb.ru/sftbmb-core/pylibinfra.git", rev = "298f005" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

# ── ruff: format + lint (аналог gofumpt + golangci-lint) ──────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "PIE",      # misc lints
    "PT",       # pytest style
    "N",        # naming
    "ASYNC",    # async pitfalls
    "S",        # bandit (≈ gosec)
    "TID",      # tidy imports (relative-import + banned-api)
    "T20",      # flake8-print: запрет print() (логи — только logkit.Logger)
    "RUF",      # ruff-specific
]
ignore = [
    "S101",                      # assert — допустим в защитных проверках вне тестов
    "RUF001", "RUF002", "RUF003",  # кириллица в комментариях (как в pylibinfra) — не ошибка
    "N818",                      # sentinel-ошибки в Go-стиле (ProfileNotFound, BackendUnavailable) — без суффикса Error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "PLR2004", "T20"]  # assert/секреты/имена/magic/print в тестах — ок

[tool.ruff.lint.isort]
known-first-party = ["bot"]

# forbidigo-аналог: прямой logging-модуль запрещён — структурные логи только через
# pylibinfra.logkit.Logger (trace-correlation + PII-redact из коробки).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "use pylibinfra.logkit.Logger (structlog + trace-id), not stdlib logging"

# ── mypy: строгая типизация ───────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# fluent.runtime не поставляет py.typed (как и в pylibinfra) — гасим missing-imports.
[[tool.mypy.overrides]]
module = "fluent.*"
ignore_missing_imports = true

# ── pytest (аналог go test; integration ≈ снятие -short) ──────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]  # чтобы tests._fakes импортировался из flow/backend-тестов
markers = [
    "unit: чистые юнит-тесты (policy/views/валидаторы)",
    "dialog: flow-тесты диалогов через BotClient (без Telegram)",
    "integration: тесты с контейнерами через testkit (Docker; снятие -short)",
    "e2e: сквозные сценарии против реального стека",
]
addopts = "--strict-markers --import-mode=importlib"
filterwarnings = [
    # purgatory (circuit breaker из pylibinfra.httpclient) тянет pkg_resources — внешнее, не наша забота
    "ignore:pkg_resources is deprecated:UserWarning",
    # testcontainers (pylibinfra.testkit) — внешние deprecation'ы их декораторов
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/bot"]

[tool.coverage.report]
show_missing = true

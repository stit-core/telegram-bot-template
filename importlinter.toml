# Границы гексагона — аналог depguard у go-template. Запускается `make lint`
# (lint-imports --config importlinter.toml). Контракты: слои фичи, независимость фич,
# чистое ядро, handlers/getters без policy, pkg не знает про бот, httpx только в pkg,
# presentation не ходит в pkg. «Одна дверь к бэкенду» — ruff banned-api (см. ниже у §7).
[tool.importlinter]
root_package = "bot"
include_external_packages = true

# 1. Слоистость ВНУТРИ фичи (DIP): presentation → views → usecase → policy → ports → dto → state.
#    Стрелки только «вниз». dialogs|getters|handlers — независимы между собой (один слой).
#    Сокращённые фичи (start/lang) не имеют views/ports/dto → (скобки) = опциональный слой.
#    notifications — не диалог-гексагон (NATS-router+deliver), в этот контракт не входит.
#    infra/ (реализации портов над не-HTTP) в слоях не участвует: его импортирует только provider.
[[tool.importlinter.contracts]]
name = "Слои внутри фичи (DIP, стрелка внутрь)"
type = "layers"
containers = [
    "bot.features.start",
    "bot.features.profile",
    "bot.features.payments",
    "bot.features.lang",
    "bot.features.booking",
]
# dialogs — верхний слой (окна ссылаются на getters/handlers); getters|handlers —
# независимы (getter=данные, handler=реакции, друг друга не импортят); ниже views→
# usecase→policy→ports→dto→state. (скобки) = опциональный слой (нет в сокращённых фичах).
layers = [
    "dialogs",
    "(getters) | (handlers)",
    "(views)",
    "usecase",
    "(policy)",
    "(ports)",
    "(dto)",
    "state",
]

# 2. Фичи независимы друг от друга — кроме cross-feature через adapters.py / provider.py.
[[tool.importlinter.contracts]]
name = "Независимость фич (cross-feature только через adapters/provider)"
type = "independence"
modules = [
    "bot.features.start",
    "bot.features.profile",
    "bot.features.payments",
    "bot.features.notifications",
    "bot.features.lang",
    "bot.features.booking",
]
# cross-feature разрешён только из adapters/provider; `*` = один сегмент, поэтому
# правая часть `bot.features.*.*` матчит конкретный модуль (start.usecase), не пакет.
ignore_imports = [
    "bot.features.*.adapters -> bot.features.*.*",
    "bot.features.*.provider -> bot.features.*.*",
]

# 3. Чистое ядро (usecase/policy/state/dto/ports/errors/views/adapters) не знает про
#    инфра-детали и про infra/ своей фичи. Wire-модели и typed-ошибки pkg-клиентов
#    (bot.pkg.*) ядру РАЗРЕШЕНЫ — это «язык» портов; запрещён сырой транспорт (httpx)
#    и presentation (aiogram). allow_indirect_imports: запрещаем только ПРЯМЫЕ импорты
#    (aiogram.StatesGroup транзитом через platform/dialogs/states — архитектура, не утечка).
[[tool.importlinter.contracts]]
name = "Чистое ядро не импортит инфру напрямую (httpx/aiogram/redis/infra)"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "bot.features.*.usecase",
    "bot.features.*.policy",
    "bot.features.*.state",
    "bot.features.*.dto",
    "bot.features.*.ports",
    "bot.features.*.errors",
    "bot.features.*.views",
    "bot.features.*.adapters",
]
forbidden_modules = [
    "httpx",
    "aiogram",
    "aiogram_dialog",
    "redis",
    "bot.features.*.infra",
]

# 4. Доменные решения — в usecase: handlers/getters НЕ зовут policy напрямую (валидация,
#    ветвление флоу приходят результатом usecase; handler только мапит их на экран/текст).
#    allow_indirect_imports: цепочка handlers → usecase → policy легальна.
[[tool.importlinter.contracts]]
name = "Handlers/getters без policy (доменные решения — в usecase)"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "bot.features.*.handlers",
    "bot.features.*.getters",
]
forbidden_modules = [
    "bot.features.*.policy",
]

# 5. pkg — переиспользуемые клиенты, не бизнес: не знает про фичи/платформу/aiogram.
[[tool.importlinter.contracts]]
name = "pkg не знает про бот (features/platform/aiogram)"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "bot.pkg",
]
forbidden_modules = [
    "bot.features",
    "bot.platform",
    "aiogram",
    "aiogram_dialog",
]

# 6. Сырой HTTP-транспорт живёт только в pkg: фича/платформа с httpx в руках — это
#    обход клиентского канона (ретраи/breaker/таксономия/Idempotency-Key теряются).
[[tool.importlinter.contracts]]
name = "HTTP-транспорт только в pkg (нет httpx в features/platform)"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "bot.features",
    "bot.platform",
]
forbidden_modules = [
    "httpx",
]

# «Одна дверь к бэкенду» (pylibinfra.httpclient только через bot.pkg.http_client) — контракт
# живёт в ruff banned-api (TID251, pyproject.toml): import-linter не умеет запрещать
# подпакет внешнего пакета (grimp схлопывает external до top-level).

# 7. Presentation (dialogs/getters/handlers) не дёргает pkg-клиентов напрямую —
#    данные приходят через usecase (anti-corruption точка фичи).
[[tool.importlinter.contracts]]
name = "Presentation не ходит в pkg (данные — через usecase)"
type = "forbidden"
allow_indirect_imports = "true"
source_modules = [
    "bot.features.*.dialogs",
    "bot.features.*.getters",
    "bot.features.*.handlers",
]
forbidden_modules = [
    "bot.pkg",
]

name: ci
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

# Приватный pylibinfra (git+https) — uv sync клонирует его при резолве. В раннере
# токен подставляется через git insteadOf (secret PYLIBINFRA_TOKEN — PAT с read:repo
# на sftbmb-core/pylibinfra). Для публичного зеркала шаг no-op.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: private deps auth
        run: |
          if [ -n "${{ secrets.PYLIBINFRA_TOKEN }}" ]; then
            git config --global url."https://oauth2:${{ secrets.PYLIBINFRA_TOKEN }}@git.sftbmb.ru/".insteadOf "https://git.sftbmb.ru/"
          fi
      - name: sync
        run: uv sync --frozen
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff lint
        run: uv run ruff check .
      - name: import-linter
        run: uv run lint-imports --config importlinter.toml
      - name: mypy
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: private deps auth
        run: |
          if [ -n "${{ secrets.PYLIBINFRA_TOKEN }}" ]; then
            git config --global url."https://oauth2:${{ secrets.PYLIBINFRA_TOKEN }}@git.sftbmb.ru/".insteadOf "https://git.sftbmb.ru/"
          fi
      - name: sync
        run: uv sync --frozen
      # быстрая полоса без контейнеров (≈ go test -short)
      - name: unit
        run: uv run pytest -m "not integration and not e2e" -q
      # полная полоса (testcontainers redis/nats — Docker есть на ubuntu-latest)
      - name: integration
        run: uv run pytest -m integration -q

  build:
    # образ собираем только на main и тегах (бот — сервис, не lib → docker, не uv build)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: |
          echo "${{ secrets.PYLIBINFRA_TOKEN }}" > /tmp/git_token
          docker buildx build \
            --secret id=git_token,src=/tmp/git_token \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            -t telegram-bot:${{ github.sha }} .
          rm -f /tmp/git_token
